<a class="skip-link" href="#main-content">Saltar al contenido</a>
<div class="app-layout">
  <!-- Desktop Sidebar & Mobile Drawer -->
  <aside id="main-navigation" class="app-sidebar" [class.open]="isMobileSidebarOpen" appNavigationDrawer [drawerOpen]="isMobileSidebarOpen" (drawerDismiss)="closeMobileSidebar()" aria-label="Menú principal">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>
        </svg>
      </div>
      <span class="sidebar-logo-text">Concepción</span>
      <button type="button" class="drawer-close" (click)="closeMobileSidebar()" aria-label="Cerrar menú"><span class="material-symbols-outlined" aria-hidden="true">close</span></button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/almacen/inventario" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMobileSidebar()" class="sidebar-link">
        <span class="material-symbols-outlined">inventory_2</span> Inventario
      </a>
      <a routerLink="/almacen/reporte" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMobileSidebar()" class="sidebar-link">
        <span class="material-symbols-outlined">analytics</span> Reporte Producción
      </a>

      <div class="spacer"></div>
      
      <button (click)="logout(); closeMobileSidebar()" class="sidebar-link sidebar-link--exit">
        <span class="material-symbols-outlined">logout</span> Cerrar Sesión
      </button>
    </nav>

    <div class="sidebar-user">
      <div class="sidebar-user-avatar">AP</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name">Almacén</div>
        <div class="sidebar-user-role">Almacén y Producción</div>
      </div>
    </div>
  </aside>

  <!-- Mobile Backdrop -->
  <div class="modal-backdrop" *ngIf="isMobileSidebarOpen" (click)="closeMobileSidebar()"></div>

  <!-- Main Content Wrapper -->
  <div class="app-content-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <button class="header-btn" (click)="toggleMobileSidebar()" aria-label="Abrir menú" aria-controls="main-navigation" [attr.aria-expanded]="isMobileSidebarOpen">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <span class="header-title font-bold text-headline-md">Distribuidora Concepción</span>
      </div>
      <div class="header-right">
        <div class="header-avatar-wrap">
          <div class="header-avatar">AP</div>
          <div class="header-user-info">
            <span class="header-user-name font-semibold text-body-sm">Almacén</span>
            <span class="header-user-role text-caption text-muted">Almacén y Producción</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Outlet -->
    <main id="main-content" tabindex="-1" class="app-main">
      <app-data-status></app-data-status>
    <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Bottom Navigation (Mobile Viewports) -->
  <nav class="app-bottom-nav">
    <a routerLink="/almacen/inventario" routerLinkActive="active" ariaCurrentWhenActive="page" class="bottom-nav-item">
      <span class="material-symbols-outlined">inventory_2</span>
      <span>Inventario</span>
    </a>
    <a routerLink="/almacen/reporte" routerLinkActive="active" ariaCurrentWhenActive="page" class="bottom-nav-item">
      <span class="material-symbols-outlined">analytics</span>
      <span>Reporte</span>
    </a>
  </nav>
</div>
