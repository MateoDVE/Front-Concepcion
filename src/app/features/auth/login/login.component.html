<div class="login-wrapper animate-fade-in">
  <div class="login-container">
    <!-- Brand Logo -->
    <div class="brand-logo mb-6">
      <span class="material-symbols-outlined logo-icon">explore</span>
      <h1 class="brand-title">Distribuidora Concepción</h1>
    </div>

    <!-- Card -->
    <div class="login-card">
      <div class="card-header mb-4">
        <h2 class="text-headline-md text-primary font-bold">Iniciar Sesión</h2>
        <p class="text-muted text-body-sm">Ingresa a la plataforma operativa de agua y hielo.</p>
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="error-alert mb-4">
        <span class="material-symbols-outlined text-sm">error</span>
        <span class="text-body-sm font-medium">{{ errorMessage }}</span>
      </div>

      <!-- Form -->
      <form (submit)="onLogin()" class="space-y-4">
        <div class="form-group">
          <label class="text-caption text-muted uppercase">Correo Electrónico</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined input-icon">mail</span>
            <input type="email" 
                   [(ngModel)]="email" 
                   name="email" 
                   required 
                   class="form-input" 
                   placeholder="ejemplo@concepcion.com" />
          </div>
        </div>

        <div class="form-group">
          <label class="text-caption text-muted uppercase">Contraseña</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined input-icon">lock</span>
            <input type="password" 
                   [(ngModel)]="password" 
                   name="password" 
                   required 
                   class="form-input" 
                   placeholder="••••••••" />
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--full mt-6 py-4" [disabled]="isLoading">
          <span *ngIf="!isLoading" class="flex items-center gap-2">
            <span class="material-symbols-outlined text-sm">login</span> Ingresar
          </span>
          <span *ngIf="isLoading">Cargando...</span>
        </button>
      </form>

    </div>
  </div>
</div>
